<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Adaptive Multi-Mode Calculator</title>
    <style>
        /* -------------------------------------------------------------
           CSS ROOT THEME DESIGN VARIABLES
        ------------------------------------------------------------- */
        :root {
            --bg-body: #0f172a;
            --bg-panel: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-panel: rgba(0, 0, 0, 0.04);
            --border-color: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --shadow-color: rgba(0, 0, 0, 0.08);
        }

        /* -------------------------------------------------------------
           GLOBAL UTILITIES & WORKSPACE LAYOUT
        ------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.1s ease;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-body);
            overflow-x: hidden;
            padding: 20px;
        }

        /* Ambient Dynamic Canvas for Interactive Modes */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-layout {
            display: flex;
            gap: 24px;
            max-width: 850px;
            width: 100%;
            z-index: 2;
        }

        .calc-wrapper {
            flex: 1.2;
        }

        /* -------------------------------------------------------------
           SYSTEM CONTROL PANELS & HEADERS
        ------------------------------------------------------------- */
        .system-dashboard {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            border-radius: 18px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .system-dashboard select {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .theme-toggle-btn {
            background: #475569;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .theme-toggle-btn:hover { background: #64748b; }

        /* -------------------------------------------------------------
           CALCULATOR ARCHITECTURE
        ------------------------------------------------------------- */
        .calculator {
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 20px 45px var(--shadow-color);
        }

        .display-container {
            position: relative;
            margin-bottom: 20px;
        }

        .preview-line {
            position: absolute;
            left: 18px;
            top: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.6;
        }

        .display {
            width: 100%;
            height: 90px;
            border: none;
            outline: none;
            border-radius: 18px;
            padding: 20px;
            font-size: 2.4rem;
            text-align: right;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 600;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:active { transform: scale(0.92); }

        /* -------------------------------------------------------------
           SIDE HISTORY LOG MANAGEMENT PANEL
        ------------------------------------------------------------- */
        .history-panel {
            flex: 0.9;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            max-height: 545px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 45px var(--shadow-color);
        }

        .history-title {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px dashed var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .history-item {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
        }
        .history-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: var(--border-color);
        }

        /* -------------------------------------------------------------
           VISUAL ADAPTATION ENGINES (MODES)
        ------------------------------------------------------------- */
        
        /* 1. CHILDREN MODE */
        body[data-mode="children"] { background: #fef08a !important; }
        body[data-mode="children"] .calculator { background: #ffffff; border: 6px solid #f43f5e; box-shadow: 0 12px 0 #e11d48; }
        body[data-mode="children"] .display { background: #f1f5f9; color: #0f172a; border: 3px solid #cbd5e1; }
        body[data-mode="children"] button { background: #38bdf8; color: #ffffff; box-shadow: 0 6px 0 #0284c7; border-radius: 20px; font-size: 1.5rem; }
        body[data-mode="children"] button:hover { background: #0ea5e9; }
        body[data-mode="children"] button.operator { background: #fbbf24; box-shadow: 0 6px 0 #d97706; }
        body[data-mode="children"] button.clear { background: #f87171; box-shadow: 0 6px 0 #dc2626; }
        body[data-mode="children"] button.equal { background: #4ade80; box-shadow: 0 6px 0 #16a34a; grid-column: span 2; }
        body[data-mode="children"] .history-panel { background: #ffffff; border: 5px solid #38bdf8; box-shadow: 0 10px 0 #0284c7; color: #334155; }
        body[data-mode="children"] .history-title { color: #0284c7; border-color: #38bdf8; }
        body[data-mode="children"] .history-item { background: #f0f9ff; border: 1px dashed #7dd3fc; color: #0369a1; }

        /* 2. BUSINESS MODE */
        body[data-mode="business"] .calculator { background: #ffffff; border-radius: 10px; border: 1px solid #cbd5e1; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        body[data-mode="business"] .display { background: #f8fafc; color: #1e293b; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; }
        body[data-mode="business"] button { background: #f1f5f9; color: #334155; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1.05rem; }
        body[data-mode="business"] button:hover { background: #e2e8f0; }
        body[data-mode="business"] button.special-biz { background: #0f172a; color: #ffffff; border-color: #0f172a; }
        body[data-mode="business"] button.special-biz:hover { background: #1e293b; }
        body[data-mode="business"] button.operator { background: #e2e8f0; }
        body[data-mode="business"] button.clear { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }
        body[data-mode="business"] button.equal { background: #2563eb; color: #ffffff; grid-column: span 2; border-color: #1d4ed8; }
        body[data-mode="business"] .history-panel { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; color: #1e293b; }
        body[data-mode="business"] .history-title { color: #0f172a; border-color: #cbd5e1; }
        body[data-mode="business"] .history-item { background: #f8fafc; border-color: #e2e8f0; }

        /* 3. SCIENTIFIC MATH MODE */
        body[data-mode="maths"] .calculator { background: #1e293b; border: 1px solid #334155; }
        body[data-mode="maths"] .display { background: #0f172a; color: #38bdf8; font-family: 'Courier New', monospace; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        body[data-mode="maths"] .grid { grid-template-columns: repeat(5, 1fr); }
        body[data-mode="maths"] button { background: #334155; color: #f8fafc; font-size: 1.1rem; }
        body[data-mode="maths"] button:hover { background: #475569; }
        body[data-mode="maths"] button.operator { background: #0284c7; }
